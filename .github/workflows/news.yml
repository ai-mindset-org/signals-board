name: news

# Новостные зацепки: каждые 15 минут жирные новости ClawDigest → что по ним уже
# снимают на YouTube и у авторов борда → подача моделью → сайт. Включается
# блоком news.enabled в signals.config.json. Запустить вручную: Actions → news.
# Коммит и публикация – только когда сюжеты изменились.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Та же группа, что у signals.yml: прогоны встают в очередь и не толкаются
# коммитами в main.
concurrency:
  group: signals
  cancel-in-progress: false

jobs:
  hooks:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Включаются переменной репозитория NEWS_ENABLED=1 либо news.enabled в
      # конфиге. Конфиг копируется в каждый репозиторий из шаблона, поэтому в
      # шаблоне он выключен, а пример включён переменной.
      - name: Зацепки включены
        id: gate
        env:
          NEWS_ENABLED: ${{ vars.NEWS_ENABLED }}
        # Блок «|»: в строке после «run:» YAML читает «: '0'» как новое поле,
        # и весь файл перестаёт разбираться.
        run: |
          node -e "process.stdout.write('on=' + (process.env.NEWS_ENABLED === '1' || require('./signals.config.json').news?.enabled ? '1' : '0') + '\n')" >> "$GITHUB_OUTPUT"
      - name: Новости и поиск роликов
        if: steps.gate.outputs.on == '1'
        env:
          NEWS_ENABLED: ${{ vars.NEWS_ENABLED }}
          CLAWDIGEST_API_KEY: ${{ secrets.CLAWDIGEST_API_KEY }}
        run: node scripts/news.mjs
      - name: Подача моделью
        if: steps.gate.outputs.on == '1'
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/news-compose.mjs
      - name: Данные проходят проверки
        if: steps.gate.outputs.on == '1'
        run: node scripts/check.mjs
      - name: Коммит зацепок
        id: commit
        if: steps.gate.outputs.on == '1'
        run: |
          git config user.name "signals-bot"
          git config user.email "signals-bot@users.noreply.github.com"
          git add site/data/news.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "без изменений"; echo "changed=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "news: зацепки $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then echo "changed=1" >> "$GITHUB_OUTPUT"; exit 0; fi
            sleep 5
          done
          exit 1

  pages:
    needs: hooks
    if: needs.hooks.outputs.changed == '1'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: pages
        uses: actions/configure-pages@v5
      - name: Адрес сайта в превью ссылки
        run: sed -i "s#%SITE%#${{ steps.pages.outputs.base_url }}#g" site/*.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
